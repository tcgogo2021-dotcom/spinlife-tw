<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpinLife 轉生活｜店家專屬櫃檯折扣拉霸機（超商同款展示版）</title>
<style>
  * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Microsoft JhengHei", sans-serif; user-select: none; }
  body { margin: 0; padding: 12px 10px 30px; background: radial-gradient(circle at top, #3b0d11 0%, #16091c 65%, #0b0c18 100%); color: #fff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
  .top-nav { width: 100%; max-width: 580px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 6px; }
  .btn-pill { background: rgba(255,255,255,0.12); border: 1px solid rgba(255,215,0,0.45); color: #ffd700; font-size: 11px; font-weight: bold; padding: 6px 12px; border-radius: 20px; text-decoration: none; cursor: pointer; }
  .cabinet { width: 100%; max-width: 580px; background: linear-gradient(180deg, #b31217 0%, #7a090d 100%); border: 4px solid #ffd700; border-radius: 24px; padding: 18px 14px 22px; box-shadow: 0 15px 40px rgba(0,0,0,0.75), inset 0 0 20px rgba(255,215,0,0.3); text-align: center; position: relative; }
  .bulb-row { display: flex; justify-content: space-around; margin-bottom: 10px; }
  .bulb { width: 10px; height: 10px; border-radius: 50%; background: #fff3bf; box-shadow: 0 0 8px #ffd700; animation: blink 1s infinite alternate; }
  .bulb:nth-child(even) { animation-delay: 0.5s; }
  @keyframes blink { from { opacity: 0.4; } to { opacity: 1; transform: scale(1.2); } }
  .shop-banner { background: #1a1a2e; border: 2px solid #ffd700; border-radius: 14px; padding: 10px; margin-bottom: 14px; }
  .shop-sub { font-size: 11px; color: #ffe066; letter-spacing: 1px; font-weight: bold; }
  .shop-title { font-size: 23px; font-weight: 900; color: #fff; margin: 2px 0 0; text-shadow: 0 2px 6px rgba(0,0,0,0.8); }
  .slot-window { background: #111; border: 3px solid #ffd700; border-radius: 16px; padding: 12px 8px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; box-shadow: inset 0 6px 16px rgba(0,0,0,0.9); }
  .reel { background: linear-gradient(180deg, #e9ecef 0%, #ffffff 50%, #dee2e6 100%); color: #1a1a2e; border-radius: 10px; height: 96px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 4px; border: 2px solid #adb5bd; overflow: hidden; }
  .reel-icon { font-size: 32px; line-height: 1.1; }
  .reel-txt { font-size: 13px; font-weight: 900; color: #c92a2a; margin-top: 4px; line-height: 1.15; }
  .btn-spin { width: 100%; padding: 16px; font-size: 20px; font-weight: 900; color: #1a1a2e; background: linear-gradient(180deg, #ffe066 0%, #fcc419 50%, #f59f00 100%); border: 3px solid #fff; border-radius: 50px; cursor: pointer; box-shadow: 0 6px 0 #b87400, 0 10px 20px rgba(0,0,0,0.5); transition: transform 0.1s; }
  .btn-spin:active { transform: translateY(4px); box-shadow: 0 2px 0 #b87400; }
  .btn-spin:disabled { background: #868e96; color: #dee2e6; border-color: #adb5bd; box-shadow: none; cursor: not-allowed; }
  .result-card { display: none; margin-top: 16px; background: #fff; color: #1a1a2e; border: 3px solid #ffd700; border-radius: 16px; padding: 16px 12px; animation: popIn 0.35s ease; }
  @keyframes popIn { from { transform: scale(0.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .res-badge { display: inline-block; background: #e94560; color: #fff; font-size: 11px; font-weight: 900; padding: 3px 10px; border-radius: 12px; }
  .res-prize { font-size: 24px; font-weight: 900; color: #d9480f; margin: 6px 0; }
  .res-time { font-family: monospace; font-size: 12px; color: #495057; background: #f1f3f5; padding: 4px 10px; border-radius: 10px; display: inline-block; margin-bottom: 10px; }
  .btn-reset { width: 100%; padding: 12px; font-size: 14px; font-weight: 900; color: #fff; background: linear-gradient(90deg, #00b894, #009432); border: none; border-radius: 30px; cursor: pointer; }
  .admin-panel { display: none; width: 100%; max-width: 580px; background: #1a1a2e; border: 2px solid #ffd700; border-radius: 16px; padding: 16px; margin-top: 14px; text-align: left; }
  .admin-panel h3 { margin: 0 0 10px; font-size: 15px; color: #ffd700; }
  .field-row { margin-bottom: 10px; }
  .field-row label { display: block; font-size: 12px; color: #ced4da; margin-bottom: 4px; }
  .field-row input { width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid #495057; background: #0f1021; color: #fff; font-size: 13px; }
  .prize-grid { display: grid; grid-template-columns: 1fr 70px; gap: 6px; margin-bottom: 6px; }
</style>
</head>
<body>
<div class="top-nav">
  <a class="btn-pill" href="../../index.html">🏠 回總部大廳</a>
  <button class="btn-pill" onclick="toggleAdmin()">⚙️ 老闆獎項與機率設定（現場展示）</button>
</div>

<div class="cabinet">
  <div class="bulb-row">
    <div class="bulb"></div><div class="bulb"></div><div class="bulb"></div><div class="bulb"></div>
    <div class="bulb"></div><div class="bulb"></div><div class="bulb"></div><div class="bulb"></div>
  </div>
  <div class="shop-banner">
    <div class="shop-sub">🎰 結帳好運轉轉樂・人人有獎</div>
    <div class="shop-title" id="displayShopName">【示範店家】台中人氣美食館</div>
  </div>
  <div class="slot-window">
    <div class="reel"><div class="reel-icon" id="icon1">🎁</div><div class="reel-txt" id="txt1">準備開轉</div></div>
    <div class="reel"><div class="reel-icon" id="icon2">🎰</div><div class="reel-txt" id="txt2">祝您中大獎</div></div>
    <div class="reel"><div class="reel-icon" id="icon3">✨</div><div class="reel-txt" id="txt3">好運連連</div></div>
  </div>
  <button class="btn-spin" id="spinBtn" onclick="startSpin()">👉 點擊螢幕・立即抽結帳折扣！</button>

  <div class="result-card" id="resultCard">
    <span class="res-badge">🎉 恭喜抽中本店專屬禮遇</span>
    <div class="res-prize" id="resPrizeText">免費招待招牌小菜乙份</div>
    <div class="res-time" id="resClock">防偽即時驗證：00:00:00</div>
    <button class="btn-reset" onclick="resetMachine()">🔄 店員確認折扣完成・重置給下一位客人</button>
  </div>
</div>

<div class="admin-panel" id="adminPanel">
  <h3>⚙️ 店家專屬後台設定（業務拜訪現場可即時修改展示）</h3>
  <div class="field-row">
    <label>1. 輸入店家名稱（現場直接輸入眼前這家店名）：</label>
    <input type="text" id="inputShopName" value="【示範店家】台中人氣美食館">
  </div>
  <div class="field-row">
    <label>2. 設定 4 個獎項名稱與中獎機率權重（總和建議為 100）：</label>
    <div class="prize-grid"><input type="text" id="pName0" value="免費招待招牌小菜／飲料乙份"><input type="number" id="pWeight0" value="65"></div>
    <div class="prize-grid"><input type="text" id="pName1" value="本單結帳現折 20 元"><input type="number" id="pWeight1" value="25"></div>
    <div class="prize-grid"><input type="text" id="pName2" value="恭喜！整單享 88 折優惠"><input type="number" id="pWeight2" value="9"></div>
    <div class="prize-grid"><input type="text" id="pName3" value="超級大獎！本日老闆請客整單免費"><input type="number" id="pWeight3" value="1"></div>
  </div>
  <button class="btn-reset" style="background:linear-gradient(90deg,#ffd700,#f59f00); color:#1a1a2e;" onclick="applySettings()">✅ 立即套用設定並更新機台畫面</button>
</div>

<script>
let prizes = [
  { icon: "🥤", short: "送小菜/飲料", full: "免費招待招牌小菜／飲料乙份", weight: 65 },
  { icon: "💰", short: "現折 20 元", full: "本單結帳現折 20 元", weight: 25 },
  { icon: "🎊", short: "整單 88 折", full: "恭喜！整單享 88 折優惠", weight: 9 },
  { icon: "👑", short: "老闆請客！", full: "超級大獎！本日老闆請客整單免費", weight: 1 }
];

let isSpinning = false;
let audioCtx = null;

function playBeep(freq, type, duration, vol) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(vol || 0.15, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  } catch (e) {}
}

function playWinFanfare() {
  const notes = [523.25, 659.25, 783.99, 1046.50, 783.99, 1046.50];
  notes.forEach((f, idx) => {
    setTimeout(() => playBeep(f, 'triangle', 0.22, 0.22), idx * 95);
  });
}

setInterval(() => {
  const n = new Date();
  const pad = v => v < 10 ? "0" + v : "" + v;
  const el = document.getElementById("resClock");
  if (el) el.innerText = "防偽即時驗證：" + pad(n.getHours()) + ":" + pad(n.getMinutes()) + ":" + pad(n.getSeconds());
}, 1000);

function toggleAdmin() {
  const p = document.getElementById("adminPanel");
  p.style.display = (p.style.display === "block") ? "none" : "block";
}

function applySettings() {
  const newName = document.getElementById("inputShopName").value.trim();
  if (newName) document.getElementById("displayShopName").innerText = newName;
  for (let i = 0; i < 4; i++) {
    const n = document.getElementById("pName" + i).value.trim();
    const w = parseInt(document.getElementById("pWeight" + i).value, 10) || 0;
    if (n) {
      prizes[i].full = n;
      prizes[i].short = n.length > 7 ? n.slice(0, 7) + ".." : n;
    }
    prizes[i].weight = w;
  }
  document.getElementById("adminPanel").style.display = "none";
  resetMachine();
  alert("✅ 已即時更新為「" + document.getElementById("displayShopName").innerText + "」專屬櫃檯拉霸機！");
}

function pickWeightedPrize() {
  const total = prizes.reduce((sum, item) => sum + item.weight, 0);
  if (total <= 0) return prizes[0];
  let r = Math.random() * total;
  for (let i = 0; i < prizes.length; i++) {
    if (r < prizes[i].weight) return prizes[i];
    r -= prizes[i].weight;
  }
  return prizes[0];
}

function startSpin() {
  if (isSpinning) return;
  isSpinning = true;
  playBeep(440, 'square', 0.08, 0.12);
  document.getElementById("spinBtn").disabled = true;
  document.getElementById("spinBtn").innerText = "🎰 好運轉動中...";
  document.getElementById("resultCard").style.display = "none";

  const winner = pickWeightedPrize();
  let ticks = 0;
  const maxTicks = 22;
  const timer = setInterval(() => {
    ticks++;
    playBeep(320 + (ticks % 4) * 65, 'triangle', 0.06, 0.12);
    for (let r = 1; r <= 3; r++) {
      const randItem = prizes[Math.floor(Math.random() * prizes.length)];
      document.getElementById("icon" + r).innerText = randItem.icon;
      document.getElementById("txt" + r).innerText = randItem.short;
    }
    if (ticks >= maxTicks) {
      clearInterval(timer);
      for (let r = 1; r <= 3; r++) {
        document.getElementById("icon" + r).innerText = winner.icon;
        document.getElementById("txt" + r).innerText = winner.short;
      }
      playWinFanfare();
      document.getElementById("resPrizeText").innerText = winner.full;
      document.getElementById("resultCard").style.display = "block";
      document.getElementById("spinBtn").innerText = "🔒 請店員確認折扣後重置";
      isSpinning = false;
    }
  }, 85);
}

function resetMachine() {
  document.getElementById("resultCard").style.display = "none";
  document.getElementById("spinBtn").disabled = false;
  document.getElementById("spinBtn").innerText = "👉 點擊螢幕・立即抽結帳折扣！";
  document.getElementById("icon1").innerText = "🎁"; document.getElementById("txt1").innerText = "準備開轉";
  document.getElementById("icon2").innerText = "🎰"; document.getElementById("txt2").innerText = "祝您中大獎";
  document.getElementById("icon3").innerText = "✨"; document.getElementById("txt3").innerText = "好運連連";
}
</script>
</body>
</html>
